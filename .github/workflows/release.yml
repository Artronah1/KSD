name: Release with SLSA Provenance

on:
  release:
    types: [created]

permissions: read-all

jobs:
  build:
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.0.0
    with:
      go-version: '1.22'
      config-file: .slsa-goreleaser.yml
      evaluated-envs: 'GOOS=linux,GOARCH=arm64'
